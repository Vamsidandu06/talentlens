const Chart=({v})=>{const d=v.map(Number).filter(x=>x>0);if(d.length<2)return <p style={{color:'var(--mute)'}}>Add at least two semester scores to see your trend.</p>;const W=400,H=150,mn=Math.min(...d,6)-.2,mx=Math.max(...d,10),X=i=>30+i*(W-50)/(d.length-1),Y=x=>H-20-(x-mn)/(mx-mn)*(H-40);return <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%'}}><defs><linearGradient id="lg"><stop offset="0" stopColor="#06b6d4"/><stop offset="1" stopColor="#ec4899"/></linearGradient></defs><polyline fill="none" stroke="url(#lg)" strokeWidth="3" points={d.map((x,i)=>X(i)+','+Y(x)).join(' ')}/>{d.map((x,i)=><g key={i}><circle cx={X(i)} cy={Y(x)} r="4" fill="#7c3aed"/><text x={X(i)} y={Y(x)-9} fontSize="11" textAnchor="middle" fill="currentColor">{x}</text><text x={X(i)} y={H-4} fontSize="10" textAnchor="middle" fill="currentColor" opacity=".6">Sem {i+1}</text></g>)}</svg>};

const ROLES=[{r:'Full Stack Developer',s:['JavaScript','React','Node.js','MongoDB','HTML','CSS','Git']},{r:'Data Scientist / ML Engineer',s:['Python','Machine Learning','SQL','TensorFlow','DSA']},{r:'Backend Developer',s:['Java','SQL','Node.js','Flask','DSA','Git']},{r:'Frontend Developer',s:['HTML','CSS','JavaScript','React','Web Dev']},{r:'Software Engineer (SDE)',s:['DSA','Java','C++','Python','SQL','Git']},{r:'Data Analyst',s:['SQL','Python','Machine Learning']}];

const strength=p=>{const c=[['Profile basics',(p.name&&p.email?5:0)+(p.phone&&p.college?4:0)+(p.linkedin?3:0)+(p.github?3:0),15,'Add phone, college, LinkedIn and GitHub links',0],['Academics',Math.min(20,Math.round(Number(cg(p))/10*20)),20,'Enter all semester GPAs',1],['Skills',Math.min(25,p.skills.length*4),25,'List 6 or more relevant skills',3],['Projects',Math.min(25,p.projects.length*9),25,'Add 3 projects with tech used',2],['Certificates',Math.min(10,p.certs.length*5),10,'Add 2 certificates',3],['Resume and photo',(p.resume?3:0)+(p.photo?2:0),5,'Upload your resume and a clear photo',0]];const t=c.reduce((a,x)=>a+x[1],0);return{c,t,lv:t>=75?'Strong':t>=50?'Good':t>=30?'Fair':'Needs work'}};

 return <div><div className="hero"><h2>Share with recruiters</h2><p>You control what to share. Your data stays private until you choose.</p></div>
 <div className="g2"><div className="card"><h3>One link for recruiters and job applications</h3><p style={{color:'var(--mute)',marginTop:0}}>Opens a read-only overview of your profile, not the website.</p>
 {tab==='link'?<div className="row"><input className="inp sp" readOnly value={url}/><button className="btn o" onClick={()=>{try{navigator.clipboard.writeText(url)}catch(e){}toast('success','Link copied')}}>Copy link</button><button className="btn" onClick={()=>Swal.fire({icon:'success',title:'Profile shared',html:`Anyone with this link sees a read-only snapshot of your profile. Edit your profile later and copy a new link to share updates.`,confirmButtonColor:'#db2777'})}>Share</button></div>:null}
 <div className="ok" style={{marginTop:12}}>You control what to share. Your data is secure and private.</div></div>
 <div className="card"><h3>What will be shared?</h3>{L.map(([k,l])=><label key={k} style={{color:'var(--ink)',margin:'6px 0'}}><input type="checkbox" checked={p.share[k]} onChange={()=>sh(k)}/> {l}</label>)}
 <hr style={{border:0,borderTop:'1px solid var(--line)'}}/><label style={{color:'var(--ink)'}}><input type="checkbox" checked={p.portal} onChange={e=>{setP({...p,portal:e.target.checked});Swal.fire({icon:e.target.checked?'success':'info',title:e.target.checked?'Added to Recruiter Portal':'Removed from Recruiter Portal',text:e.target.checked?'Recruiters can now view your profile.':'Your profile is hidden from the portal.',confirmButtonColor:'#db2777'})}}/> Add to Recruiter Portal</label></div></div>
 <button className="btn" onClick={()=>open(snap(p,th))}>Preview the overview</button></div>};

function Recruiter({p}){const S=p.share;
 const contact=()=>Swal.fire({title:'Contact '+p.name,html:'<input id="rn" class="swal2-input" placeholder="Your name / company"><textarea id="rm" class="swal2-textarea" placeholder="Message"></textarea>',showCancelButton:true,confirmButtonColor:'#db2777',confirmButtonText:'Send message',preConfirm:()=>{const n=document.getElementById('rn').value.trim(),m=document.getElementById('rm').value.trim();if(!n||!m){Swal.showValidationMessage('Enter your name and a message');return false}return{n,m}}}).then(r=>{if(r.isConfirmed){window.open('mailto:'+p.email+'?subject='+encodeURIComponent('Job opportunity for '+p.name)+'&body='+encodeURIComponent(r.value.m+'\n\n'+r.value.n),'_blank');toast('success','Opening your email app')}});
 const dl=()=>{const t=`${p.name}\n${p.degree}, ${p.college}\nCGPA ${cg(p)}\nSkills: ${p.skills.map(s=>s.n).join(', ')}\nProjects: ${p.projects.map(x=>x.t).join(', ')}`;try{navigator.clipboard.writeText(t)}catch(e){}toast('success','Profile summary copied')};
 return <div><div className="hero row"><Av p={p} s={80}/><div className="sp"><h2>{p.name}</h2><p>{p.degree} | {p.year}</p><SL p={p}/><span className="chip on" style={{cursor:'default',background:'#fff',color:'#065f46'}}>Open to opportunities</span></div><button className="btn" style={{background:'#fff',color:'#9d174d'}} onClick={dl}>Download profile</button><button className="btn" style={{background:'#fff',color:'#9d174d'}} onClick={contact}>Contact</button></div>
 {S.profile&&<Snap p={p}/>}<p style={{color:'var(--mute)'}}>Overview of the student's profile, based on their sharing choices.</p>
 <div className="g2">{S.video&&<div className="card"><h3>Introduction video</h3>{p.videoReady?<Player p={p}/>:<p style={{color:'var(--mute)'}}>No video generated yet.</p>}</div>}
 {S.profile&&<div className="card"><h3>Key highlights</h3><p>{cg(p)} CGPA<br/>{p.projects.length} projects<br/>{p.certs.length} certificates<br/>Strong in {p.skills.slice(0,3).map(s=>s.n).join(', ')||'—'}</p></div>}
 {S.academic&&<div className="card"><h3>Academic performance</h3><Chart v={p.sems}/></div>}
 {S.projects&&<div className="card"><h3>Skills & projects</h3>{p.skills.map(s=><span key={s.n} className="chip" style={{cursor:'default'}}>{s.n} {s.l}%</span>)}{p.projects.map((x,i)=><p key={i}><b>{x.t}</b> <span style={{color:'var(--mute)'}}>{x.tech}</span><br/>{x.d}<br/><PL x={x}/></p>)}</div>}
 {S.certs&&<div className="card"><h3>Certificates</h3>{p.certs.length?p.certs.map((c,i)=><div key={i}>{cn(c)}{c.f&&<> <button className="chip" onClick={()=>viewCert(c)}>View</button></>}</div>):<span style={{color:'var(--mute)'}}>None added.</span>}</div>}</div></div>};

function App(){
 const [me,setMe]=useState(()=>ls.get('tl_me',null));const [p,setP]=useState(()=>{const m=ls.get('tl_me',null);return m?load(m):blank});
 const [view,setView]=useState(()=>{const m=ls.get('tl_me',null);return m&&ls.get('tl_p_'+m,null)?.script?'dashboard':'profile'});const [step,setStep]=useState(0);const [sh,setSh]=useState(()=>parseShare(location.hash));
 useEffect(()=>{if(me)ls.set('tl_p_'+me,p)},[p,me]);
 const onIn=(e,isNew)=>{ls.set('tl_me',e);setP(load(e));setMe(e);setStep(0);setView(isNew||!ls.get('tl_p_'+e,null)?.script?'profile':'dashboard')};
 const go=(v,s)=>{setView(v);if(s!=null)setStep(s);window.scrollTo(0,0)};
 const out=()=>Swal.fire({icon:'question',title:'Log out?',text:'Your profile stays saved on this device.',showCancelButton:true,confirmButtonColor:'#db2777',confirmButtonText:'Log out'}).then(r=>{if(r.isConfirmed){ls.set('tl_me',null);setMe(null);toast('success','Logged out')}});
 if(sh)return <Shared o={sh} back={()=>{try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}setSh(null)}}/>;if(!me)return <Login onIn={onIn} open={setSh}/>;
 const N=[['dashboard','Dashboard'],['profile','Profile',0],['resume','Resume'],['profile','Projects',2],['profile','Academic',1],['profile','Skills',3],['video','Intro video'],['strength','Resume strength'],['jobs','Job matches'],['share','Share'],['recruiter','Recruiter view']];
 const on=(v,s)=>view===v&&(v!=='profile'||s==null||s===step);
 return <div className="app"><nav className="side"><div className="lg">TalentLens AI</div>{N.map(([v,l,s])=><button key={l} className={'nav'+(on(v,s)&&(v!=='profile'||['Profile','Projects','Academic','Skills'].includes(l)&&(s===step))?' on':'')} onClick={()=>go(v,s)}>{l}</button>)}<button className="nav" onClick={out}>Log out</button></nav>
 <main className="main">{view==='dashboard'&&<Dashboard p={p} go={go}/>}{view==='profile'&&<Profile p={p} setP={setP} step={step} setStep={setStep} go={go}/>}{view==='resume'&&<Resume p={p} setP={setP} go={go}/>}{view==='video'&&<Video p={p} setP={setP}/>}{view==='share'&&<Share p={p} setP={setP} go={go} open={setSh}/>}{view==='strength'&&<Strength p={p} go={go}/>}{view==='jobs'&&<Jobs p={p}/>}{view==='recruiter'&&<Recruiter p={p}/>}</main></div>};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
