
name: Deploy TalentLens AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify website files
        run: |
          ls -la
          ls -la www
          test -f www/index.html
          echo "Website entry file found"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./www

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
